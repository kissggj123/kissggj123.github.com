name: Auto Optimize & Deploy Wallpapers

on:
  push:
    paths:
      - 'wallpaper/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install Pillow

      - name: Optimize Wallpapers & Update Manifest
        run: |
          python3 optimize_wallpapers.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add wallpaper/
          if git diff --staged --quiet; then
            echo "No wallpaper changes to commit."
          else
            git commit -m "chore(wallpaper): auto optimize new wallpapers & update manifest [skip ci]"
            git push origin master
          fi
