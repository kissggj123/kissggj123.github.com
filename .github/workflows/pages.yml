# Simple workflow for deploying static content to GitHub Pages
name: Deploy GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying static files
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate Wallpaper Manifest
        run: |
          python3 -c "
          import os, json, datetime
          wp_dir = 'wallpaper'
          valid_exts = ('.jpg', '.jpeg', '.png', '.webp', '.gif', '.avif', '.svg')
          files = []
          if os.path.exists(wp_dir):
              for f in sorted(os.listdir(wp_dir)):
                  if f.lower().endswith(valid_exts):
                      name = os.path.splitext(f)[0]
                      files.append({
                          'id': name,
                          'name': name,
                          'file': f'wallpaper/{f}'
                      })
          manifest = {
              'wallpapers': files,
              'updatedAt': datetime.datetime.utcnow().isoformat() + 'Z'
          }
          with open(os.path.join(wp_dir, 'manifest.json'), 'w', encoding='utf-8') as out:
              json.dump(manifest, out, ensure_ascii=False, indent=2)
          print(f'Generated wallpaper manifest with {len(files)} wallpapers.')
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
