<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>兔可可的魔塔档案馆 · Demo</title>
<style>
:root{
  --bg:#2a1f2e; --panel:#fff0f6; --panel2:#ffe3ef; --ink:#5a2a44; --dim:#a3708c;
  --accent:#ff6b9d; --accent2:#ff9ec3; --good:#3fc380; --warn:#ffb347; --bad:#ff5a76;
  --blue:#5aa9ff; --gold:#ffc94d; --tile:#fbe4ee; --tile2:#f7d6e4; --wall:#e8a9c4;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;overflow:hidden;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none}
/* ---------- boot CRT ---------- */
#boot{position:fixed;inset:0;background:#000;color:#33ff66;font-family:Consolas,monospace;
  padding:24px;font-size:14px;line-height:1.8;z-index:50;white-space:pre-wrap}
#boot .cur{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
/* ---------- layout ---------- */
#game{display:none;flex-direction:column;align-items:center;width:100%;max-width:760px;
  height:100%;padding:6px;gap:6px}
#status{width:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;
  background:var(--panel);border-radius:12px;padding:6px 8px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#status .st{background:var(--panel2);border-radius:8px;padding:3px 8px;white-space:nowrap}
#status .st b{color:var(--accent)}
#floorTag{background:var(--accent);color:#fff;border-radius:8px;padding:3px 10px}
#mapWrap{flex:0 0 auto;position:relative;background:var(--panel);border-radius:12px;padding:5px;
  box-shadow:0 4px 16px rgba(0,0,0,.35)}
#map{display:grid;grid-template-columns:repeat(15,var(--ts));grid-auto-rows:var(--ts)}
:root{--ts:34px}
@media(max-width:560px){:root{--ts:min(22px,(100vw - 28px)/15)}}
.tile{width:var(--ts);height:var(--ts);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--ts)*.62);position:relative;user-select:none}
.tile.f{background:var(--tile)}
.tile.f:nth-child(2n){background:var(--tile2)}
.tile.w{background:var(--wall);border-radius:4px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),inset 0 2px 0 rgba(255,255,255,.45)}
.tile.hero{background:var(--accent);border-radius:50%;box-shadow:0 0 8px var(--accent);z-index:2}
.tile.item{cursor:pointer}
.tile.door-y{background:var(--gold);border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tile.door-b{background:var(--blue);border-radius:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.tile.portal{background:linear-gradient(135deg,#7b5cff,#33ffcc);border-radius:6px;cursor:pointer;animation:pulse 2s infinite}
@keyframes pulse{50%{filter:brightness(1.35)}}
/* ---------- dialog ---------- */
#dialog{width:100%;min-height:96px;background:var(--panel);border-radius:12px;padding:10px 12px 10px 56px;
  position:relative;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
#dialog .face{position:absolute;left:8px;top:8px;width:40px;height:40px;background:var(--panel2);
  border:2px solid var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
#dialog .name{font-size:12px;color:var(--accent);font-weight:700}
#dialog .txt{font-size:14px;line-height:1.55;min-height:44px}
#dialog .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#dialog .opts button{background:var(--accent);color:#fff;border-radius:8px;padding:5px 12px;font-size:13px}
#dialog .opts button.alt{background:#e8b7cc;color:#5a2a44}
#dialog .hint{position:absolute;right:10px;bottom:4px;font-size:10px;color:var(--dim)}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(30,10,25,.72);display:none;align-items:center;
  justify-content:center;z-index:30;padding:14px}
.modal.show{display:flex}
.card{background:var(--panel);border-radius:16px;padding:18px;max-width:420px;width:100%;
  text-align:center;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.card h3{color:var(--accent);margin-bottom:8px}
.card .sub{font-size:13px;color:var(--dim);margin-bottom:10px}
.card .body{font-size:14px;line-height:1.7;text-align:left;margin-bottom:12px}
.card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.card .row button{border-radius:10px;padding:8px 16px;font-size:14px}
.btn-main{background:var(--accent);color:#fff}
.btn-alt{background:#e8d5de;color:var(--ink)}
.btn-gh{background:#24292e;color:#fff}
.badge{display:inline-block;background:var(--accent2);color:#7a2850;border-radius:6px;
  padding:1px 8px;font-size:12px;margin:2px}
.rarity2{box-shadow:0 0 10px var(--blue)}
.rarity3{box-shadow:0 0 14px var(--gold);border:2px solid var(--gold)}
/* battle preview */
.bp{display:flex;justify-content:space-around;margin:10px 0;font-size:13px}
.bp .col{background:var(--panel2);border-radius:10px;padding:8px 14px;min-width:110px}
.bp .mono{font-family:Consolas,monospace;font-size:12px;color:var(--dim);margin-top:4px;line-height:1.6}
/* ---------- checkout ---------- */
#price{font-size:30px;font-weight:800;color:var(--ink);transition:all .4s}
#price.strike{text-decoration:line-through;color:var(--dim);font-size:22px}
#free{display:none;font-size:26px;font-weight:900;color:var(--good);animation:pop .4s ease}
#paySpin{display:none;margin:10px auto;width:26px;height:26px;border:3px solid var(--accent2);
  border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chan{display:flex;justify-content:space-between;align-items:center;background:#fff;
  border:2px solid #eee;border-radius:10px;padding:10px 12px;width:100%;color:var(--ink);text-align:left}
.chan.sel{border-color:var(--accent);background:var(--panel2)}
.chan .radio{width:16px;height:16px;border:2px solid #ccc;border-radius:50%;display:inline-block;flex:0 0 auto}
.chan.sel .radio{border-color:var(--accent);background:radial-gradient(circle,var(--accent) 40%,transparent 45%)}
.btn-pay{background:#07c160;color:#fff;border-radius:12px;padding:12px;font-size:16px;font-weight:700;width:100%}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;display:none}
/* ---------- toast / achievement ---------- */
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  border-radius:10px;padding:8px 18px;font-size:14px;opacity:0;transition:.3s;z-index:45;pointer-events:none}
#toast.show{opacity:1}
.ach{background:linear-gradient(135deg,var(--gold),#ffe9a8);color:#7a4a00}
/* ---------- dpad ---------- */
#dpad{display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,44px);gap:4px;margin-bottom:6px}
#dpad button{background:var(--panel);border-radius:10px;font-size:18px;color:var(--ink)}
@media(pointer:coarse){#dpad{display:grid}}
#menuBtns{display:flex;gap:6px;font-size:12px}
#menuBtns button{background:var(--panel2);border-radius:8px;padding:4px 10px;color:var(--ink)}
#fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:.4s;z-index:20}
</style>
</head>
<body>

<div id="boot"></div>
<div id="fade"></div>

<div id="game">
  <div id="status"></div>
  <div id="mapWrap"><div id="map"></div></div>
  <div id="menuBtns">
    <button onclick="UI.codex()">📖 图鉴</button>
    <button onclick="UI.ach()">🏆 成就</button>
    <button onclick="UI.bag()">🎒 角色</button>
    <button onclick="UI.charge()" style="background:var(--gold);color:#5a3a00;font-weight:700">💰 充值</button>
    <button onclick="UI.settings()">⚙️</button>
  </div>
  <div id="dialog">
    <div class="face">🐰</div>
    <div class="name">兔可可</div>
    <div class="txt" id="dlgTxt"></div>
    <div class="opts" id="dlgOpts"></div>
    <div class="hint">点击继续 ▾</div>
  </div>
  <div id="dpad">
    <span></span><button onclick="Game.tryMove(0,-1)">↑</button><span></span>
    <button onclick="Game.tryMove(-1,0)">←</button><button onclick="Game.tryMove(0,1)">↓</button><button onclick="Game.tryMove(1,0)">→</button>
  </div>
</div>

<!-- 战斗预览 -->
<div class="modal" id="mBattle"><div class="card">
  <h3>⚔️ 遭遇 <span id="bName"></span></h3>
  <div class="bp">
    <div class="col">玩家<div class="mono" id="bMe"></div></div>
    <div class="col" id="bFoeCol"><span id="bFoe"></span><div class="mono" id="bCalc"></div></div>
  </div>
  <div id="bSkill"></div>
  <div class="row">
    <button class="btn-main" id="bGo">开战</button>
    <button class="btn-alt" onclick="UI.close('mBattle')">撤退</button>
  </div>
</div></div>

<!-- 项目事件卡 -->
<div class="modal" id="mEvent"><div class="card" id="evCard">
  <h3 id="evIcon">📦</h3>
  <div class="sub" id="evName"></div>
  <div class="body" id="evBody"></div>
  <div class="row" id="evBtns"></div>
</div></div>

<!-- 商店 -->
<div class="modal" id="mShop"><div class="card">
  <h3>🛒 兔可可商店</h3>
  <div class="sub">宝石：<b id="shopGem">0</b> · XP：<b id="shopXp">0</b></div>
  <div class="body" id="shopList"></div>
  <div class="row"><button class="btn-alt" onclick="UI.close('mShop')">离开</button></div>
</div></div>

<!-- 充值中心 -->
<div class="modal" id="mCharge"><div class="card">
  <h3>💰 充值中心</h3>
  <div class="sub">所有充值均可 100% 免单 · 支付后立即到账</div>
  <div class="body" id="chargeList" style="text-align:left"></div>
  <div class="row"><button class="btn-alt" onclick="UI.close('mCharge')">关闭</button></div>
</div></div>

<!-- 收银台 -->
<div class="modal" id="mPay"><div class="card" style="max-width:380px">
  <h3 style="text-align:left;border-bottom:2px solid var(--accent2);padding-bottom:8px" id="payTitle">🧧 超级氪金礼包</h3>
  <div class="sub" style="text-align:left">订单号：<span id="payNo" style="font-family:Consolas"></span> · 商户：兔可可档案馆</div>
  <div class="body" style="text-align:center">
    <div style="font-size:12px;color:var(--dim)" id="payDesc">HP+500 / 攻+50 / 防+50 / 三色钥匙各3</div>
    <div id="price">¥ 648.00</div>
    <div id="free">FREE 🎉</div>
    <div id="paySpin"></div>
    <div id="payMsg" style="min-height:20px;font-size:13px;color:var(--dim)"></div>
  </div>
  <div class="row" id="payBtns" style="flex-direction:column;align-items:stretch;gap:8px"></div>
</div></div>

<!-- 图鉴/成就/角色/设置 共用 -->
<div class="modal" id="mInfo"><div class="card">
  <h3 id="infoTitle"></h3>
  <div class="body" id="infoBody" style="max-height:50vh;overflow:auto"></div>
  <div class="row"><button class="btn-alt" onclick="UI.close('mInfo')">关闭</button></div>
</div></div>

<!-- 通关结算 -->
<div class="modal" id="mEnd"><div class="card">
  <h3>🏁 通关结算</h3>
  <div class="body" id="endBody" style="text-align:center"></div>
  <div class="row" id="endBtns"></div>
</div></div>

<div id="toast"></div>
<canvas id="confetti"></canvas>

<script>
'use strict';
/* ==================== 数据 ==================== */
const MAPS = [
[ '###############',
  '#S.....Y...1.g#',
  '#.##...#.###..#',
  '#.ka...g.#2..h#',
  '#.#...###.##..#',
  '#.b.B.#E..#.T.#',
  '#...k.#...#...#',
  '#..g..#####..3#',
  '#.###.....c.g.#',
  '#N....Y...##l.#',
  '###############' ],
[ '###############',
  '#.....#...g..b#',
  '#.....#.....Y.#',
  '#.###.#.###.#.#',
  '#.#h..B.#M..#.#',
  '#.#.###.###.#.#',
  '#...a...E...#l#',
  '###############' ]
];
const MONSTERS = {
  a:{name:'内存泄漏史莱姆',hp:200,atk:50,def:10,xp:30,drop:{key:'y',p:.5},icon:'🟢'},
  b:{name:'404 幽灵',hp:350,atk:72,def:25,xp:60,drop:{gem:3},icon:'👻'},
  c:{name:'NullPointerException',hp:550,atk:95,def:40,xp:100,drop:{gem:4},icon:'😈'},
  M:{name:'Bug 之王',hp:1200,atk:130,def:60,xp:500,drop:{equip:'k2'},boss:true,icon:'👑'}
};
const EVENTS = {
  '1':{type:'repo',repo:'Bunny-Cockpit-OS',icon:'🚗',lore:'兔可可王国的车机锁屏系统，一切的开始。为新能源车座舱大屏而设计，也是这座档案馆的第一块记忆碎片。'},
  '2':{type:'repo',repo:'YumikoToys',icon:'🧸',lore:'AI 桌宠玩具系列，会撒娇也会顶嘴。据说夜深时会偷偷整理主人的 commit 历史。'},
  '3':{type:'repo',repo:'DarkSouls_Work',icon:'🔥',lore:'上着班写黑魂同人战斗系统。受苦是会传染的，代码也是。'},
  E:{type:'equip',equip:'k1'},
  N:{type:'shop'}
};
const EQUIPS = {
  k1:{name:'传说中的机械键盘',atk:15,slot:'weapon',rarity:2,icon:'⌨️'},
  k2:{name:'Bug 之王残刃',atk:25,def:5,slot:'weapon',rarity:3,icon:'🗡️'},
  s1:{name:'防烧屏镀膜',def:8,slot:'armor',rarity:1,icon:'🛡️'},
  a1:{name:'幸运胡萝卜吊坠',slot:'accessory',effect:{gemBonus:1},rarity:2,icon:'🥕'},
  n1:{name:'胡萝卜短剑',atk:8,slot:'weapon',rarity:1,icon:'🥖'},
  n2:{name:'兔耳发带',def:6,slot:'armor',rarity:1,icon:'🎀'},
  n3:{name:'月光护符',slot:'accessory',effect:{gemBonus:1},rarity:2,icon:'🌙'},
  S1:{name:'Bug 之王冠冕',atk:30,def:10,slot:'armor',rarity:3,icon:'👑'}
};
const GACHA_POOL = ['n1','n2','n3','k1','a1','k2','S1'];
const GACHA_RATE = [[1,60],[2,30],[3,10]]; // [稀有度, 权重]
const SKUS = {
  c6:  {name:'🥕 首充礼包', price:'¥ 6.00',   num:6,   icon:'🥕', buff:()=>{G.gem+=30;G.keys.y+=2;},    desc:'宝石×30 + 黄钥匙×2'},
  c30: {name:'🧧 小月卡',    price:'¥ 30.00',  num:30,  icon:'🧧', buff:()=>{G.gem+=150;},               desc:'宝石×150'},
  c98: {name:'🎫 大月卡',    price:'¥ 98.00',  num:98,  icon:'🎫', buff:()=>{G.gem+=500;Gacha.give(2);}, desc:'宝石×500 + 稀有装备×1'},
  c328:{name:'💎 至尊礼包',  price:'¥ 328.00', num:328, icon:'💎', buff:()=>{G.gem+=1800;G.keys.y+=3;G.keys.b+=3;Gacha.give(3);}, desc:'宝石×1800 + 三色钥匙 + 史诗装备×1'},
  c648:{name:'🧧 超级氪金礼包', price:'¥ 648.00', num:648, icon:'🧧', buff:()=>{G.hp+=500;G.atk+=50;G.def+=50;G.keys.y+=3;G.keys.b+=3;G.gem+=3000;}, desc:'HP+500 攻+50 防+50 三色钥匙 宝石×3000'},
  box: {name:'🎁 神秘装备箱 ×1', price:'¥ 88.00', num:88, icon:'🎁', isBox:true, desc:'按概率开出装备（普通60/稀有30/史诗10）'}
};
const REPO_URL = 'https://github.com/kissggj123/';
const ACHS = {
  first:{name:'初来乍到',desc:'看完第一个项目'},
  codex3:{name:'图鉴收藏家',desc:'收录 3 个项目'},
  whale:{name:'💎 氪金玩家',desc:'完成一次模拟支付'},
  clear:{name:'🏁 一周目通关',desc:'击败 Bug 之王'},
  cheat:{name:'⌨ 开挂的人生',desc:'使用控制台作弊'}
};
const FALLBACK_CLASS = {name:'兔可可',desc:'档案管理员本兔，均衡型，绒毛护体。',hp:1000,atk:60,def:40,
  skill:{name:'护体绒毛',type:'passive',desc:'每场战斗首回合免伤'}};

/* ==================== 状态 ==================== */
let G = null;
function newGame(ng){
  const prev = ng ? G : null;
  return {
    cycle: prev ? prev.cycle+1 : 1, floor:0, pos:null,
    hp:1000, atk:60, def:40, gem:0, xp:0, keys:{y:1,b:0},
    equip:{weapon:null,armor:null,accessory:null}, skills:[], cds:{},
    flags:{}, achs:{}, codex:[], killed:{}, seen:{}, gachaLog:[], gachaSeq:0,
    name: prev?prev.name:'访客', cls:null,
    ai:{baseUrl:localStorage.getItem('bcos_ai_baseUrl')||'https://api.qnaigc.com',
        model:localStorage.getItem('bcos_ai_model')||'qiniu/conatus-free',
        key:localStorage.getItem('bcos_ai_key')||''}
  };
}
function save(){ try{localStorage.setItem('rpg_demo_save',JSON.stringify(G));}catch(e){} }
function load(){ try{const s=localStorage.getItem('rpg_demo_save'); return s?JSON.parse(s):null;}catch(e){return null;} }

function totalAtk(){ let a=G.atk; for(const s of ['weapon','armor','accessory']){const e=G.equip[s]; if(e&&e.atk)a+=e.atk;} return a; }
function totalDef(){ let d=G.def; for(const s of ['weapon','armor','accessory']){const e=G.equip[s]; if(e&&e.def)d+=e.def;} return d; }
function maxHp(){ let h=G.hp; return h; } // hp 即当前上限简化
function monsterScale(){ return 1+0.5*(G.cycle-1); }

/* ==================== UI 基础 ==================== */
const $ = id=>document.getElementById(id);
function toast(msg,cls){ const t=$('toast'); t.textContent=msg; t.className='show '+(cls||'');
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.className='',2400); }
function ach(id){ if(G.achs[id])return; G.achs[id]=true; toast('🏆 解锁成就「'+ACHS[id].name+'」','ach'); save(); }

const UI = {
  close(id){ $(id).classList.remove('show'); },
  codex(){
    $('infoTitle').textContent='📖 项目图鉴 ('+G.codex.length+'/3)';
    let h=G.codex.length?'':'<div style="color:var(--dim)">还是空的，去开宝箱吧</div>';
    for(const r of G.codex) h+='<div style="margin-bottom:8px"><span class="badge">'+r.icon+' '+r.name+'</span>'+
      '<div style="font-size:12px;color:var(--dim)">'+r.desc+'</div></div>';
    $('infoBody').innerHTML=h; $('mInfo').classList.add('show');
  },
  ach(){
    $('infoTitle').textContent='🏆 成就墙';
    let h=''; for(const k in ACHS){ const got=G.achs[k];
      h+='<div style="margin-bottom:6px;opacity:'+(got?1:.4)+'">'+(got?'✅':'⬜')+' <b>'+ACHS[k].name+'</b> <span style="font-size:12px;color:var(--dim)">'+ACHS[k].desc+'</span></div>'; }
    $('infoBody').innerHTML=h; $('mInfo').classList.add('show');
  },
  bag(){
    const c=G.cls||FALLBACK_CLASS;
    let h='<div style="text-align:center;margin-bottom:8px"><b style="font-size:16px">'+c.name+'</b> · '+G.name+
      ' · '+G.cycle+'周目</div><div style="font-size:12px;color:var(--dim);text-align:center;margin-bottom:8px">'+c.desc+'</div>';
    h+='<div>❤️ '+G.hp+'　⚔️ '+totalAtk()+'　🛡️ '+totalDef()+'　💎 '+G.gem+'　⭐ XP '+G.xp+'</div>';
    h+='<div style="margin-top:6px">🔑 黄×'+G.keys.y+'　🔵 蓝×'+G.keys.b+'</div>';
    h+='<div style="margin-top:8px"><b>装备</b><br>';
    for(const s of ['weapon','armor','accessory']){ const e=G.equip[s];
      h+= e? '<span class="badge rarity'+e.rarity+'">'+e.icon+' '+e.name+(e.atk?' 攻+'+e.atk:'')+(e.def?' 防+'+e.def:'')+'</span>'
           : '<span class="badge">空('+s+')</span>'; }
    h+='</div><div style="margin-top:8px"><b>技能</b><br>';
    h+= c.skill?'<span class="badge">'+(c.skill.type==='passive'?'🛡️被动':'⚡主动')+' '+c.skill.name+'：'+c.skill.desc+'</span>':'';

/* ==================== 对话引擎（打字机） ==================== */
const Dlg = {
  q:[], typing:false, done:null,
  say(lines,opts,done){ this.q=lines.slice(); this._opts=opts||null; this.done=done||null; this.next(); },
  next(){
    if(!this.q.length){
      if(this._opts){ this.renderOpts(this._opts); return; }
      if(this.done){ const d=this.done; this.done=null; d(); }
      return;
    }
    const item=this.q.shift();
    if(typeof item==='function'){ item(); this.next(); return; }
    this.type(item);
  },
  type(text){
    this.typing=true; const el=$('dlgTxt'); el.textContent=''; let i=0;
    const tm=setInterval(()=>{ el.textContent=text.slice(0,++i);
      if(i>=text.length){ clearInterval(tm); this.typing=false; } },18);
    el._full=text;
  },
  skip(){ if(this.typing){ $('dlgTxt').textContent=$('dlgTxt')._full; this.typing=false; const t=$('dlgTxt')._full; }
    else this.next(); },
  renderOpts(opts){
    const box=$('dlgOpts'); box.innerHTML='';
    for(const o of opts){ const b=document.createElement('button');
      b.textContent=o[0]; if(o[2])b.className='alt';
      b.onclick=e=>{ e.stopPropagation(); box.innerHTML=''; o[1](); };
      box.appendChild(b); }
  }
};
$('dialog').addEventListener('click',()=>{ if(Dlg.typing) Dlg.skip(); else if(!Dlg.q.length&&!$('dlgOpts').children.length&&Dlg.done) Dlg.next(); else Dlg.skip(); });

function tileAt(x,y){ const m=MAPS[G.floor]; return (m[y]&&m[y][x])||'#'; }
function setTile(x,y,ch){ const r=MAPS[G.floor]; r[y]=r[y].substring(0,x)+ch+r[y].substring(x+1); }

const Game = {
  tryMove(dx,dy){
    if(!G||!G.pos)return;
    if($('mBattle').classList.contains('show')||$('mEvent').classList.contains('show')||$('mPay').classList.contains('show'))return;
    const nx=G.pos.x+dx, ny=G.pos.y+dy, ch=tileAt(nx,ny);
    if(ch==='#')return;
    if(ch==='Y'||ch==='B'){
      const k=ch==='Y'?'y':'b';
      if(G.keys[k]>0){ G.keys[k]--; setTile(nx,ny,'.'); toast('使用'+(k==='y'?'黄':'蓝')+'钥匙开门'); }
      else{ toast('需要'+(k==='y'?'黄':'蓝')+'钥匙！'); return; }
      save(); renderMap(); return;
    }
    if(MONSTERS[ch]){ Battle.preview(nx,ny,ch); return; }
    if(EVENTS[ch]){ Events.trigger(nx,ny,ch); return; }
    if(ch==='T'){ Game.ascend(); return; }
    if(ch==='g'){ G.gem+=2+((G.equip.accessory&&G.equip.accessory.effect.gemBonus)||0); setTile(nx,ny,'.'); toast('💎 宝石 +2'); }
    if(ch==='h'){ G.hp+=250; setTile(nx,ny,'.'); toast('🍓 HP +250'); }
    if(ch==='k'){ G.keys.y++; setTile(nx,ny,'.'); toast('🔑 黄钥匙 +1'); }
    if(ch==='l'){ G.keys.b++; setTile(nx,ny,'.'); toast('🗝️ 蓝钥匙 +1'); }
    G.pos={x:nx,y:ny}; save(); renderMap();
  },
  ascend(){
    if(G.floor>=MAPS.length-1){ return; }

      G.floor++; G.pos=Game.findTile('T')||{x:1,y:1};

          '（提示：打开宝箱、吃宝石变强后再去；打不过可以在商店买属性）'],null,()=>{});

      renderMap();
    });
  },
  findTile(ch){ const m=MAPS[G.floor];
    for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++) if(m[y][x]===ch)return{x,y}; return null; },
  fadeIn(mid){ const f=$('fade'); f.style.opacity=1; setTimeout(()=>{ mid(); f.style.opacity=0; },420); },
  victory(){

/* ==================== 战斗 ==================== */
const Battle = {
  cur:null,
  preview(x,y,ch){
    const m=MONSTERS[ch], sc=monsterScale();
    const foe={name:m.name,hp:Math.round(m.hp*sc),atk:Math.round(m.atk*sc),def:Math.round(m.def*sc),xp:Math.round(m.xp*sc)};
    this.cur={x,y,ch,foe};
    // 模拟结算（被动首回合免伤）
    const sim=(skipFirst)=>{
      let myhp=G.hp,foehp=foe.hp,round=0,hurt=0;
      const myAtk=totalAtk(),myDef=totalDef();
      while(foehp>0&&myhp>0){ round++;
        foehp-=Math.max(myAtk-foe.def,0);
        if(!(round===1&&skipFirst)) { const dmg=Math.max(foe.atk-myDef,0); myhp-=dmg; hurt+=dmg; } }
      return {win:foehp<=0,hurt,round};
    };
    const r=sim(true); const rNo=sim(false);
    $('bName').textContent=m.icon+' '+m.name+(G.cycle>1?' (×'+sc+')':'');
    $('bMe').innerHTML='❤️'+G.hp+' ⚔️'+totalAtk()+' 🛡️'+totalDef();
    $('bFoe').innerHTML='❤️'+foe.hp+' ⚔️'+foe.atk+' 🛡️'+foe.def;
    $('bCalc').innerHTML=r.win?('预计受伤 -'+r.hurt+'（'+r.round+'回合）'):('<span style="color:var(--bad)">打不过！预计重伤</span>');
    $('bGo').style.display=r.win?'':'none';
    $('bGo').onclick=()=>this.fight();
    $('mBattle').classList.add('show');
  },
  fight(){
    const {x,y,ch,foe}=this.cur; UI.close('mBattle');
    let myhp=G.hp,foehp=foe.hp,round=0;
    const myAtk=totalAtk(),myDef=totalDef(),firstFree=(G.cls&&G.cls.skill&&G.cls.skill.name==='护体绒毛');
    while(foehp>0&&myhp>0){ round++;
      foehp-=Math.max(myAtk-foe.def,0);
      if(!(round===1&&firstFree)) myhp-=Math.max(foe.atk-myDef,0); }
    G.hp=Math.max(1,myhp); G.xp+=foe.xp; G.killed[ch]=(G.killed[ch]||0)+1;
    setTile(x,y,'.'); G.pos={x,y};
    let msg=m0=>m0;
    const drops=[];
    const m=MONSTERS[ch];
    if(m.drop&&m.drop.key&&Math.random()<m.drop.p){ G.keys.y++; drops.push('🔑 黄钥匙'); }
    if(m.drop&&m.drop.gem){ G.gem+=m.drop.gem; drops.push('💎 宝石×'+m.drop.gem); }
    if(m.drop&&m.drop.equip){ Events.giveEquip(m.drop.equip); }
    toast('⚔️ 击败'+m.name+'！XP+'+foe.xp+(drops.length?'　'+drops.join(' '):''));
    save(); renderMap();
    if(m.boss) setTimeout(()=>Game.victory(),600);
  }
};

    $('payNo').textContent='BC'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*900+100);
    const p=$('price'); p.className=''; p.style.cssText='font-size:34px;font-weight:800';
    $('free').style.display='none'; $('paySpin').style.display='none'; $('payMsg').textContent='';
    const btns=$('payBtns'); btns.innerHTML='';
    const chans=[['rabbit','🐰 兔可可币','可用余额 ¥ 1,048,576.00'],
                 ['carrot','🥕 胡萝卜信用卡','储蓄卡 · 尾号 8848'],
                 ['moon','🌙 月光宝盒钱包','人脸支付 · 极速到账']];
    for(const [id,name,sub] of chans){
      const b=document.createElement('button'); b.className='chan'+(id==='rabbit'?' sel':'');
      b.innerHTML='<span><b>'+name+'</b><br><span style="font-size:11px;color:var(--dim)">'+sub+'</span></span><span class="radio"></span>';
      b.onclick=()=>{ document.querySelectorAll('.chan').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel'); Checkout.channel=id; };
      btns.appendChild(b);
    }
    const pay=document.createElement('button'); pay.className='btn-pay'; pay.textContent='立即支付 '+s.price;
    pay.onclick=()=>this.pay(pay); btns.appendChild(pay);
    $('mPay').classList.add('show');
  },
  pay(btn){
    const names={rabbit:'兔可可币',carrot:'胡萝卜信用卡',moon:'月光宝盒钱包'};
    $('payBtns').querySelectorAll('button').forEach(b=>b.style.pointerEvents='none');
    btn.style.opacity=.7;
    $('payMsg').textContent='正在跳转到 '+names[this.channel]+' …';
    $('paySpin').style.display='block';
    setTimeout(()=>{ $('payMsg').textContent='支付处理中，请稍候…'; },900);
    setTimeout(()=>{
      $('paySpin').style.display='none';
      const p=$('price'); p.classList.add('strike');
      setTimeout(()=>{ $('free').style.display='block';
        $('payMsg').textContent='支付成功，礼包已发放至背包 🎉'; this.success(); },600);
    },2000);
  },
  success(){
    const s=SKUS[this.sku];
    if(s.isBox){ Gacha.roll(); }
    else { s.buff(); }
    ach('whale'); save(); renderMap();
    confetti();
    setTimeout(()=>{
      const btns=$('payBtns'); btns.innerHTML='';
      const b1=document.createElement('button'); b1.className='btn-main'; b1.textContent='🎉 已到账，返回游戏';
      b1.onclick=()=>UI.close('mPay');
      const b2=document.createElement('button'); b2.className='btn-gh'; b2.textContent='⭐ 顺手 Star 作者';
      b2.onclick=()=>window.open('https://github.com/kissggj123','_blank');
      btns.append(b1,b2);
    },1500);
  }
};

/* ==================== 彩带 ==================== */
function confetti(){
  const cv=$('confetti'); cv.style.display='block'; cv.width=innerWidth; cv.height=innerHeight;
  const ctx=cv.getContext('2d'); const parts=[];
  for(let i=0;i<80;i++)parts.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-12-4,
    c:['#ff6b9d','#ffc94d','#5aa9ff','#3fc380'][i%4],r:Math.random()*6+3,life:60});
  let n=0; const tm=setInterval(()=>{ ctx.clearRect(0,0,cv.width,cv.height); let alive=0;
    for(const p of parts){ p.x+=p.vx;p.y+=p.vy;p.vy+=.4;p.life--; if(p.life>0)alive++;
      ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); }
    if(!alive||++n>90){ clearInterval(tm); ctx.clearRect(0,0,cv.width,cv.height); cv.style.display='none'; } },33);
}

  get state(){return JSON.parse(JSON.stringify({...G,clsName:G.cls&&G.cls.name}));},
  god(){G.hp=99999;G.atk=999;G.def=999;toast(' Cheat ON');ach('cheat');save();renderMap();},
  hp(n){G.hp=n||99999;ach('cheat');save();renderMap();},
  atk(n){G.atk=n||200;ach('cheat');save();renderMap();},
  def(n){G.def=n||200;ach('cheat');save();renderMap();},
  key(n){G.keys.y=n||9;G.keys.b=n||9;ach('cheat');save();renderMap();},
  xp(n){G.xp=n||1000;ach('cheat');save();renderMap();},
  tp(f){G.floor=f||0;G.pos=Game.findTile('S')||Game.findTile('T')||{x:1,y:1};ach('cheat');save();renderMap();},
  pay(){Checkout.open();ach('cheat');},
  win(){ach('cheat');Game.victory();}
}};

/* ==================== 二周目 ==================== */
function startNG(){
  const keep={cycle:G.cycle,hp:G.hp,atk:G.atk,def:G.def,gem:G.gem,xp:G.xp,keys:G.keys,
    equip:G.equip,skills:G.skills,cds:G.cds,achs:G.achs,codex:G.codex,killed:G.killed,name:G.name,ai:G.ai,
    gachaLog:G.gachaLog,gachaSeq:G.gachaSeq};
  G=newGame(true); Object.assign(G,keep); G.cycle=keep.cycle+1; G.floor=0; G.pos=null;
  // 二周目职业：档案幽灵主题
  if(G.ai.key){ summonClass(true); } else { G.cls={name:'档案幽灵',desc:'二周目限定：档案馆里游荡的前代访客。',
    hp:1100,atk:70,def:45,skill:{name:'相位穿行',type:'passive',desc:'每场战斗首回合免伤'}};
    enterFloor1(); }
  save();
}

/* ==================== 职业召唤 ==================== */
function summonClass(ng){
  const card=document.createElement('div'); card.className='card'; card.id='summonCard';
  card.innerHTML='<h3>✨ 召唤职业档案</h3><div class="sub">正在从档案馆检索你的角色…</div>'+
    '<div id="sumBody" style="min-height:60px;font-size:14px;color:var(--dim)">…</div>';
  const wrap=document.createElement('div'); wrap.className='modal show'; wrap.id='mSummon'; wrap.appendChild(card);
  document.body.appendChild(wrap);
  const finish=(c)=>{ G.cls=c; wrap.remove();
    Dlg.say(['叮——你的职业档案生成好了！','【'+c.name+'】'+c.desc,'技能：'+c.skill.name+'（'+c.skill.desc+'）'],null,enterFloor1); };
  if(!G.ai.key){ setTimeout(()=>finish(ng?{name:'档案幽灵',desc:'二周目限定：档案馆里游荡的前代访客。',
    hp:1100,atk:70,def:45,skill:{name:'相位穿行',type:'passive',desc:'每场战斗首回合免伤'}}:FALLBACK_CLASS),900); return; }
  // AI 生成职业
  $('sumBody').textContent='兔可可正在请求 AI 撰写你的命运…';
  fetch(G.ai.baseUrl+'/v1/chat/completions',{method:'POST',
    headers:{'Authorization':'Bearer '+G.ai.key,'Content-Type':'application/json'},
    body:JSON.stringify({stream:false,model:G.ai.model,response_format:{type:'json_object'},messages:[
      {role:'system',content:'为魔塔小游戏生成一个随机玩家职业。只输出JSON：{"name":"职业名(8字内,可爱玩梗)","desc":"一句话档案(30字内)","hp":700到1000整数,"atk":50到75整数,"def":25到55整数,"skillName":"技能名","skillDesc":"技能效果一句话(15字内)","skillType":"passive或active"}。'+(ng?'主题必须是档案馆幽灵/CRT悬疑风。':'主题随机但必须可爱。')},
      {role:'user',content:'生成一个职业'}]}),signal:AbortSignal.timeout(20000)})
  .then(r=>r.json()).then(j=>{
    const o=JSON.parse(j.choices[0].message.content);
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,Math.round(v)||a));
    finish({name:String(o.name).slice(0,12),desc:String(o.desc).slice(0,60),
      hp:clamp(o.hp,600,1100),atk:clamp(o.atk,45,80),def:clamp(o.def,20,60),
      skill:{name:String(o.skillName||'神秘天赋').slice(0,10),type:o.skillType==='active'?'active':'passive',desc:String(o.skillDesc||'效果未知').slice(0,30)}});
  }).catch(()=>{ toast('AI 走神了，使用兜底职业'); finish(ng?{name:'档案幽灵',desc:'二周目限定：档案馆里游荡的前代访客。',
    hp:1100,atk:70,def:45,skill:{name:'相位穿行',type:'passive',desc:'每场战斗首回合免伤'}}:FALLBACK_CLASS); });
}

/* ==================== 开场流程 ==================== */
function enterFloor1(){
  G.hp=G.cls.hp; G.atk=G.cls.atk; G.def=G.cls.def;
  Game.fadeIn(()=>{
    $('mSummon')&&$('mSummon').remove();
    G.pos=Game.findTile('S');
    renderMap();
    const intro=G.cycle>1?
      ['欢迎回来，'+G.name+'。','这一次，档案馆的灯光是冷的。怪物们也变强了（×'+monsterScale()+'）——但你的力量被完整继承了。','去揭开上次没说完的故事吧。']
      :['欢迎来到「兔可可的魔塔档案馆」，'+G.name+'！','这里收藏着铲屎官写过的每一个项目。打开宝箱、阅读记忆碎片，就能把它们收录进你的图鉴！',
        '绿色的是怪物，金色的是门——钥匙要省着用哦。右下角的 🌀 楼梯通往下一层。'];
    Dlg.say(intro,null,()=>{ save(); });
  });
}

function bootSequence(){
  const lines=[
    'BUNNY_TOWER BIOS v1.0 ......... OK',
    'MEM CHECK 640K ................ OK',
    'LOADING ARCHIVE ............... 3 FILES',
    'WALLPAPER DRIVER .............. SKIPPED (PINK)',
    '',
    'WELCOME TO BUNNY TOWER.',
    'PRESS ANY KEY_'
  ];
  const el=$('boot'); let i=0;
  const tm=setInterval(()=>{
    if(i<lines.length){ el.innerHTML=lines.slice(0,++i).join('\n')+'<span class="cur">█</span>'; }
    else{ clearInterval(tm); el.innerHTML=lines.join('\n')+'<span class="cur">█</span>';
      const go=()=>{ removeEventListener('keydown',go); removeEventListener('pointerdown',go);
        $('boot').style.display='none'; $('game').style.display='flex'; mainMenu(); };
      addEventListener('keydown',go); addEventListener('pointerdown',go); }
  },260);
}

function mainMenu(){
  const saved=load();
  if(saved&&saved.cycle){ G=saved; renderMap();
    Dlg.say(['欢迎回来，'+G.name+'！存档已恢复（'+G.cycle+'周目 · '+(G.floor===0?'1F':'2F')+'）。'],[
      ['继续冒险',()=>{}],['重新开始（清空存档）',()=>{localStorage.removeItem('rpg_demo_save');location.reload();},true]
    ]); return; }
  G=newGame(false);
  Dlg.say(['RSS 探测完成。检测到新访客接入。','我是兔可可，这座魔塔档案馆的管理员。在正式参观之前——'],[
    ['召唤我的职业',()=>summonClass(false)],
    ['随便玩玩（跳过职业）',()=>{G.cls=FALLBACK_CLASS;enterFloor1();},true]
  ]);
}

bootSequence();
