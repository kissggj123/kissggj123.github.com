<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bunny Cockpit OS</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="manifest" href="./manifest.json">
<style>
/* BCOS v8.2 - 干净重构版 */
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B1026;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#bcos-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a2a4a 0%,#0B1026 70%)}
#bcos-boot .logo{font-size:72px;margin-bottom:16px;animation:float 3s ease-in-out infinite}
#bcos-boot h1{font-size:24px;font-weight:700;background:linear-gradient(90deg,#7c8cff,#b48cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#bcos-boot .ver{margin-top:8px;font-size:13px;opacity:.5}
#bcos-boot .status{margin-top:24px;font-size:13px;opacity:.7}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div id="bcos-boot">
<div class="logo">🐰</div>
<h1>Bunny Cockpit OS</h1>
<div class="ver" id="bcos-ver">v8.2.0</div>
<div class="status" id="bcos-status">正在重构中...</div>
</div>
<script src="./js/version.js"></script>
<script>
// 显示版本号
try {
  const v = window.BCOS_VERSION || 'v8.2.0';
  document.getElementById('bcos-ver').textContent = v;
} catch(e) {}
// Phase 1 内核 (不干扰，仅定义)
</script>
<script src="./js/phase1/boot.js"></script>
<script src="./js/phase1/vfs.js"></script>
<script>
// 更新状态
setTimeout(function(){
  const s = document.getElementById('bcos-status');
  if (s) {
    const p1 = window._bcosPhase1 ? '✅' : '❌';
    const vfs = window._bcosVFS ? '✅' : '❌';
    s.innerHTML = 'Phase 1 内核 ' + p1 + ' · VFS ' + vfs + '<br><span style="font-size:11px">重构进行中，敬请期待</span>';
  }
}, 500);
</script>
</body>
</html>
