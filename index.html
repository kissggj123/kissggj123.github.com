<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>兔可可纪念日 🐰</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#000}
#car-frame{position:fixed;inset:0;width:100%;height:100%;border:none}
#bcos-hud{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;pointer-events:none;font-size:12px;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.6)}
#bcos-hud .memorial{background:rgba(0,0,0,.45);padding:6px 12px;border-radius:10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#bcos-hud .memorial b{color:#ffb5ba}
#bcos-hud .actions{pointer-events:auto;display:flex;gap:8px}
#bcos-hud .btn{padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);color:#fff;font-size:12px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
</style>
</head>
<body>
<iframe id="car-frame" src="./car.html" allow="autoplay"></iframe>
<div id="bcos-hud">
<div class="memorial">🐰 <b id="bcos-days">--</b> 天</div>
<div class="actions">
<button class="btn" onclick="toggleFS()">⛶</button>
</div>
</div>
<script src="./js/version.js"></script>
<script>
// 纪念日计数
try {
  const days = Math.floor((Date.now() - new Date('2024/03/12 00:00:00').getTime()) / 86400000);
  document.getElementById('bcos-days').textContent = days;
} catch(e) {}
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function(){});
}
</script>
</body>
</html>
