<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bunny Cockpit OS</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B1026;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
#bcos-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a2a4a 0%,#0B1026 70%)}
#bcos-boot .logo{font-size:72px;margin-bottom:16px;animation:float 3s ease-in-out infinite;line-height:1}
#bcos-boot h1{font-size:24px;font-weight:700;background:linear-gradient(90deg,#7c8cff,#b48cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#bcos-boot .ver{margin-top:8px;font-size:13px;opacity:.5}
#bcos-boot .memorial{margin-top:20px;text-align:center}
#bcos-boot .memorial .t{font-size:15px;opacity:.9}
#bcos-boot .memorial .d{margin-top:6px;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
#bcos-boot .memorial .d small{font-size:14px;font-weight:400;opacity:.6}
#bcos-boot .memorial .n{margin-top:8px;font-size:12px;opacity:.6}
#bcos-boot .memorial .n b{color:#ffb54d}
#bcos-boot .bottom{position:fixed;bottom:32px;left:0;right:0;display:flex;justify-content:space-between;padding:0 32px}
#bcos-boot .btn{padding:12px 24px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#bcos-boot .btn:active{transform:scale(.95)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div id="bcos-boot">
<div class="logo">🐰</div>
<h1>Bunny Cockpit OS</h1>
<div class="ver" id="bcos-ver">v8.2.0</div>
<div class="memorial">
<div class="t">🐰 兔可可纪念日</div>
<div class="d"><span id="bcos-days">--</span><small> 天</small></div>
<div class="n" id="bcos-next"></div>
</div>
<div class="bottom">
<button class="btn" onclick="location.href='./car.html'">🚗 车机锁屏</button>
<button class="btn" onclick="toggleFS()">⛶ 全屏</button>
</div>
</div>
<script src="./js/version.js"></script>
<script>
const START_DATE = '2024/03/12 00:00:00';
const MILESTONES = [
  { days: 100, label: '100天纪念' }, { days: 180, label: '180天纪念' },
  { days: 300, label: '300天纪念' }, { days: 365, label: '一周年 (365天)' },
  { days: 500, label: '500天纪念' }, { days: 730, label: '两周年 (730天)' },
  { days: 1000, label: '1000天纪念' }, { days: 1095, label: '三周年 (1095天)' },
  { days: 1461, label: '四周年 (1461天)' }, { days: 1500, label: '1500天纪念' },
  { days: 1826, label: '五周年 (1826天)' }, { days: 2000, label: '2000天纪念' },
  { days: 3652, label: '十周年 (3652天)' }, { days: 10000, label: '10000天 (万日之约)' }
];
try { document.getElementById('bcos-ver').textContent = window.BCOS_VERSION || 'v8.2.0'; } catch(e) {}
function upd() {
  try {
    const t = (Date.now() - new Date(START_DATE).getTime()) / 86400000;
    document.getElementById('bcos-days').textContent = t.toFixed(3);
    const nx = MILESTONES.find(function(m){ return t < m.days; });
    if (nx) document.getElementById('bcos-next').innerHTML = '距 <b>' + nx.label + '</b> 还有 <b>' + (nx.days - t).toFixed(3) + '</b> 天';
  } catch(e) {}
}
upd(); setInterval(upd, 1000);
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function(){});
}
</script>
</body>
</html>
