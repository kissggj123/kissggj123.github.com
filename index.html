<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>兔可可纪念日 🐰</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c1a;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;min-height:100vh}
#bg{position:fixed;inset:0;background:radial-gradient(ellipse at 30% 20%,#1a2a5a 0%,#0a0c1a 60%,#060814 100%)}
#main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}#main{position:relative;z-index:1;height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(8px,2vh,20px);padding-top:calc(max(clamp(8px,2vh,20px), env(safe-area-inset-top)) + 20px);text-align:center;overflow-y:auto;overflow-x:hidden}
@media (orientation:portrait){#main{padding-top:calc(env(safe-area-inset-top, 20px) + 44px)}}
#main::-webkit-scrollbar{width:0}
.logo{font-size:clamp(48px,10vw,64px) !important;width:clamp(64px,14vw,88px) !important;height:clamp(64px,14vw,88px) !important;position:relative;margin:0 auto !important;display:flex !important;align-items:center;justify-content:center}
.logo::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,#7c8cff,#b48cff,#ff6b9d,#7c8cff);animation:spin 4s linear infinite;z-index:-1;filter:blur(8px);opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
.days .num{font-size:clamp(56px,16vw,84px) !important;text-shadow:0 0 40px rgba(124,140,255,.5);animation:numGlow 3s ease-in-out infinite}
@keyframes numGlow{0%,100%{text-shadow:0 0 30px rgba(124,140,255,.4);transform:scale(1)}50%{text-shadow:0 0 60px rgba(124,140,255,.8);transform:scale(1.02)}}
h1{font-size:clamp(18px,4.5vw,22px) !important}
.logo{font-size:64px;margin-bottom:12px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 8px 24px rgba(124,140,255,.35));width:88px;height:88px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font-size:22px;font-weight:800;letter-spacing:.08em;background:linear-gradient(90deg,#a8b8ff,#d8b8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.since{margin-top:6px;font-size:11px;opacity:.45;letter-spacing:.15em}
.days{margin-top:clamp(12px,2.5vh,24px)}
.days .num{font-size:84px;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#a8b8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.days .unit{font-size:14px;opacity:.5;letter-spacing:.3em;margin-top:4px}
.voyage{margin-top:16px;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:.05em}
.day-progress{margin-top:12px;width:min(340px,86vw);margin-left:auto;margin-right:auto}
.dp-bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.dp-bar i{display:block;height:100%;background:linear-gradient(90deg,#7c8cff,#b48cff);border-radius:2px;transition:width .1s linear;position:relative;overflow:hidden}
.dp-bar i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.dp-label{margin-top:6px;font-size:11px;opacity:.5}
.voyage b{color:#7c8cff}
.target{margin-top:clamp(12px,2vh,20px);width:min(340px,86vw);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.target .t{font-size:13px;display:flex;justify-content:space-between;align-items:center}
.target .t b{color:#ffb54d}
.target .bar{margin-top:10px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.target .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#7c8cff,#b48cff);transition:width .5s ease}
.next-panel{margin-top:clamp(8px,1.5vh,14px);width:min(340px,86vw);background:rgba(124,140,255,.08);border:1px solid rgba(124,140,255,.2);border-radius:16px;padding:14px}
.np-title{font-size:13px;font-weight:700;margin-bottom:10px;text-align:left}
.np-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.np-item{background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px;font-size:11px}
.np-item .k{opacity:.6}
.np-item .v{font-weight:700;margin-top:2px;font-size:12px}
.np-item .d{opacity:.5;font-size:10px;margin-top:2px}
.milestones{margin-top:clamp(8px,1.5vh,12px);width:min(340px,86vw)}
.ms-toggle{width:100%;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff;font-size:13px;cursor:pointer}
.ms-list{margin-top:8px;max-height:220px;overflow-y:auto;text-align:left}
.ms-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.06)}
@keyframes msIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:translateX(0)}}
.ms-item.done{opacity:.45}
.ms-item .d{color:#ffb54d}
.actions{margin-top:clamp(16px,3vh,28px);margin-bottom:12px;display:flex;gap:14px;justify-content:center;align-items:center;width:100%}
.btn{padding:14px 32px;border-radius:16px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}
.btn{transition:all .2s ease}
.btn:active{transform:scale(.95)}
.btn.car:hover{box-shadow:0 8px 32px rgba(124,140,255,.6);transform:translateY(-2px)}
.btn.car{background:linear-gradient(135deg,#7c8cff,#b48cff);color:#fff;box-shadow:0 8px 24px rgba(124,140,255,.35)}
.btn.fs{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.15)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
/* 横屏：左右两栏 */
@media (orientation: landscape) and (min-width: 700px) {
  #main{flex-direction:row !important;justify-content:center;gap:clamp(24px,5vw,64px);align-items:center}
  #main .left-col{display:flex;flex-direction:column;align-items:center;animation:floatY 6s ease-in-out infinite}
  #main .right-col{display:flex;flex-direction:column;align-items:center;max-width:380px;animation:floatY 6s ease-in-out 1s infinite}
  .days .num{font-size:clamp(64px,10vw,96px) !important}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .target,.next-panel{transition:transform .3s ease, box-shadow .3s ease}
  .target:hover,.next-panel:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 8px 32px rgba(124,140,255,.25)}
}
#main > *{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) backwards}
#main > *:nth-child(1){animation-delay:.05s}#main > *:nth-child(2){animation-delay:.1s}
#main > *:nth-child(3){animation-delay:.15s}#main > *:nth-child(4){animation-delay:.2s}
#main > *:nth-child(5){animation-delay:.25s}#main > *:nth-child(6){animation-delay:.3s}
#main > *:nth-child(7){animation-delay:.35s}#main > *:nth-child(8){animation-delay:.4s}
#car-app{position:fixed;inset:0;z-index:9000;display:none;background:#000}
#car-app.open{display:block}
#car-app iframe{width:100%;height:100%;border:none}
#car-app .close-btn{position:absolute;top:16px;right:16px;z-index:9001;width:40px;height:40px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:20px;cursor:pointer;backdrop-filter:blur(8px)}
#av-picker{position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#av-picker.open{display:flex;animation:pickerIn .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pickerIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
#av-picker .panel{animation:panelGlow 2s ease-in-out infinite}
@keyframes panelGlow{0%,100%{box-shadow:0 0 30px rgba(124,140,255,.25)}50%{box-shadow:0 0 50px rgba(124,140,255,.45)}}
#av-picker.open{display:flex}
#av-picker .panel{background:#1a1e35;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;width:min(320px,90vw)}
#av-picker h3{font-size:15px;margin-bottom:12px}
#av-picker .emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-bottom:12px}
#av-picker .emojis div{font-size:24px;text-align:center;padding:6px;border-radius:8px;cursor:pointer;background:rgba(255,255,255,.05)}
#av-picker .emojis div:active{background:rgba(124,140,255,.3)}
#av-picker .close{margin-top:8px;width:100%;padding:10px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
</style>
</head>
<body>
<div id="bg"></div>
<button onclick="openThemePicker()" style="position:fixed;top:14px;right:14px;z-index:100;width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);backdrop-filter:blur(8px);cursor:pointer;font-size:18px" title="主题">🎨</button>
<div id="theme-picker" style="position:fixed;inset:0;z-index:9500;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(12px)">
<div style="background:#1a1e35;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;width:min(360px,92vw);max-height:70vh;overflow-y:auto">
<h3 style="font-size:15px;margin-bottom:12px;text-align:center">🎨 选择主题</h3>
<div style="font-size:12px;opacity:.6;margin-bottom:8px;text-align:left">🎨 主题色</div>
<div id="theme-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px"></div>
<div style="font-size:12px;opacity:.6;margin-bottom:8px;text-align:left">🖼️ 壁纸背景</div>
<div id="wp-grid" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px"></div>
<div id="ver-tag" style="margin-top:12px;text-align:center;font-size:11px;opacity:.4">v--</div>
<button onclick="closeThemePicker()" style="margin-top:8px;width:100%;padding:10px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:#fff;cursor:pointer">关闭</button>
</div>
</div>
<div id="main">
<div class="left-col">
<div class="logo" id="main-logo" onclick="openAvatarPicker()" style="cursor:pointer" title="点击更换头像">🐰</div>
<h1>兔可可相伴虚拟纪元</h1>
<div class="since">SINCE 2024.03.12</div>
<div class="days">
<div class="num" id="days-num">--</div>
<div class="unit">DAYS</div>
</div>
<div class="voyage"><b id="voy-h">--</b>时 <b id="voy-m">--</b>分 <b id="voy-s">--</b>.<b id="voy-ms" style="font-size:12px;opacity:.7">000</b>秒</div>
</div>
<div class="right-col">
<div class="total-h" id="total-h" style="margin-top:6px;font-size:12px;opacity:.55">🎂 已经到来 <b id="th-h">--</b>小时<b id="th-m">--</b>分钟<b id="th-s">--</b>秒</div>
<div class="day-progress"><div class="dp-bar"><i id="dp-fill"></i></div><div class="dp-label" id="dp-label"></div></div>
<div class="target">
<div class="t"><span>🎯 <span id="target-label">--</span></span><b id="target-remain">--</b></div>
<div class="bar"><i id="target-bar" style="width:0%"></i></div>
</div>
<div class="next-panel" id="next-panel">
<div class="np-title">🌱 下一个里程碑</div>
<div class="np-grid" id="np-grid"></div>
</div>
<div class="milestones">
<button class="ms-toggle" onclick="toggleMS()">🏆 全部里程碑 <span id="ms-arrow">▼</span></button>
<div class="ms-list" id="ms-list" style="display:none"></div>
</div>
<div id="car-app">
<button class="close-btn" onclick="closeCar()">✕</button>
<iframe src="./car.html"></iframe>
</div>
<div id="av-picker">
<div class="panel">
<h3>🐰 选择头像</h3>
<div id="av-emojis" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px"></div>

<button class="close" onclick="closeAvatarPicker()">关闭</button>
</div>
</div>
<div class="actions">
<button class="btn car" onclick="openCar()">🚗 车机锁屏</button>
<button class="btn fs" onclick="toggleFS()">⛶ 全屏</button>
</div>
</div>
</div>
<script>
const START = new Date('2024/03/12 00:00:00').getTime();
const MILESTONES = [
  {days:100,label:'100天纪念'},{days:180,label:'180天纪念'},{days:300,label:'300天纪念'},
  {days:365,label:'一周年'},{days:500,label:'500天纪念'},{days:730,label:'两周年'},
  {days:1000,label:'1000天纪念 · 千日里程碑'},{days:1095,label:'三周年'},{days:1461,label:'四周年'},
  {days:1500,label:'1500天纪念'},{days:1826,label:'五周年'},{days:2000,label:'2000天纪念'},
  {days:3652,label:'十周年'},{days:10000,label:'万日之约'}
];
function upd() {
  const now = Date.now();
  const totalDays = (now - START) / 86400000;
  document.getElementById('days-num').textContent = totalDays.toFixed(3);
  const h = Math.floor(totalDays * 24) % 24, m = Math.floor(totalDays * 1440) % 60, s = Math.floor(totalDays * 86400) % 60;
  document.getElementById('voy-h').textContent = h;
  document.getElementById('voy-m').textContent = String(m).padStart(2,'0');
  document.getElementById('voy-s').textContent = String(s).padStart(2,'0');
  document.getElementById('voy-ms').textContent = String(Math.floor((now % 1000))).padStart(3,'0');
  const totalH = Math.floor((now - START) / 3600000);
  const totalM = Math.floor((now - START) / 60000) % 60;
  const totalS = Math.floor((now - START) / 1000) % 60;
  document.getElementById('th-h').textContent = totalH;
  document.getElementById('th-m').textContent = totalM;
  document.getElementById('th-s').textContent = totalS;
  // 今日24小时进度
  const dayPct = (now - new Date().setHours(0,0,0,0)) / 86400000 * 100;
  document.getElementById('dp-fill').style.width = dayPct.toFixed(2) + '%';
  document.getElementById('dp-label').textContent = '今日已流逝 ' + dayPct.toFixed(1) + '%';
  const nx = MILESTONES.find(function(x){ return totalDays < x.days; });
  if (nx) {
    const prev = MILESTONES[MILESTONES.indexOf(nx) - 1];
    const base = prev ? prev.days : 0;
    const pct = Math.min(100, (totalDays - base) / (nx.days - base) * 100);
    document.getElementById('target-label').textContent = nx.label;
    document.getElementById('target-remain').textContent = '还有 ' + Math.ceil(nx.days - totalDays) + ' 天';
    document.getElementById('target-bar').style.width = pct + '%';
  }
}
function toggleMS() {
  const l = document.getElementById('ms-list');
  const a = document.getElementById('ms-arrow');
  const show = l.style.display === 'none';
  l.style.display = show ? 'block' : 'none';
  a.textContent = show ? '▲' : '▼';
  if (show) renderMS();
}
function fmtDate(ts) {
  // 不受本地时区影响，用 UTC 计算
  const d = new Date(ts);
  return d.getUTCFullYear() + '/' + String(d.getUTCMonth()+1).padStart(2,'0') + '/' + String(d.getUTCDate()).padStart(2,'0');
}
function renderMS() {
  const now = Date.now();
  const totalDays = (now - START) / 86400000;
  const l = document.getElementById('ms-list');
  l.innerHTML = MILESTONES.map(function(m, i) {
    const done = totalDays >= m.days;
    // 里程碑日期 = 起始日 + N天 (UTC，不受时区影响)
    const msDate = START + m.days * 86400000;
    const dateStr = fmtDate(msDate);
    const remain = done ? '✅ 已达成' : '剩 ' + Math.ceil(m.days - totalDays) + ' 天';
    return '<div class="ms-item' + (done ? ' done' : '') + '" style="animation:msIn .3s ' + (i * 0.04) + 's backwards">'
      + '<div><div style="font-weight:600">' + (done ? '🏆 ' : '⏳ ') + m.label + '</div>'
      + '<div style="font-size:11px;opacity:.5;margin-top:2px">' + dateStr + '</div></div>'
      + '<div class="d">' + remain + '</div></div>';
  }).join('');
}
// 头像：照片或emoji可切换（在预览页设置里换）
try {
  const av = localStorage.getItem('bcosAvatar');
  const logo = document.getElementById('main-logo');
  if (av && av.startsWith('photo:')) {
    logo.innerHTML = '<img src="' + av.slice(6) + '">';
  } else if (av && av.startsWith('data:')) {
    logo.innerHTML = '<img src="' + av + '">';
  } else if (av) {
    logo.textContent = av;
  }
} catch(e) {}
function updNext() {
  const now = Date.now();
  const td = (now - START) / 86400000;
  const items = [
    {k:'🌱 100天', cycle:100, icon:'🌱'},
    {k:'🌿 180天', cycle:180, icon:'🌿'},
    {k:'🍀 300天', cycle:300, icon:'🍀'},
    {k:'🎉 周年', cycle:365, icon:'🎉'},
  ];
  document.getElementById('np-grid').innerHTML = items.map(function(it) {
    const n = Math.ceil(td / it.cycle);
    const target = n * it.cycle;
    const d = new Date(START + target * 86400000);
    const ds = d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
    const label = it.cycle === 365 ? n + '周年' : '第' + n + '个' + it.cycle + '天';
    return '<div class="np-item"><div class="k">' + it.k + '</div><div class="v">' + ds + '</div><div class="d">' + label + '</div></div>';
  }).join('');
}
try { document.getElementById('ver-tag').textContent = window.BCOS_VERSION || 'v8.2.0.9417'; } catch(e) {}
// 动态顶部间距：根据屏幕高度计算
function fixTop() {
  const main = document.getElementById('main');
  const h = window.innerHeight;
  // 顶部留白 = 屏幕高度的 6%，最少 60px（避开刘海）
  const top = Math.max(60, h * 0.06);
  main.style.paddingTop = top + 'px';
}
fixTop();
window.addEventListener('resize', fixTop);
window.addEventListener('orientationchange', function(){ setTimeout(fixTop, 300); });
upd(); updNext(); setInterval(function(){ upd(); }, 100); setInterval(updNext, 60000);
function openCar() {
  document.getElementById('car-app').classList.add('open');
  // 自动全屏
  const el = document.getElementById('car-app');
  if (el.requestFullscreen) el.requestFullscreen().catch(function(){});
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){});
}
function closeCar() {
  document.getElementById('car-app').classList.remove('open');
  if (document.fullscreenElement) document.exitFullscreen().catch(function(){});
}
function openAvatarPicker() {
  const opt = 'display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 8px;border-radius:14px;cursor:pointer;min-height:110px';
  const av = 'width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0';
  const lb = 'font-size:12px;margin-top:8px;text-align:center';
  document.getElementById('av-emojis').innerHTML =
    '<div onclick="setAvatarPhoto()" style="' + opt + ';background:rgba(124,140,255,.15)">'
    + '<div style="' + av + '"><img src="./dist/Bunny CC_Profile.JPG" style="width:100%;height:100%;object-fit:cover"></div>'
    + '<div style="' + lb + '">兔可可照片</div></div>'
    + '<div onclick="setAvatar(\'🐰\')" style="' + opt + ';background:rgba(255,255,255,.05)">'
    + '<div style="' + av + ';font-size:40px;background:rgba(255,255,255,.08)">🐰</div>'
    + '<div style="' + lb + '">兔子表情</div></div>';
  document.getElementById('av-picker').classList.add('open');
}
function setAvatarPhoto() {
  const url = './dist/Bunny CC_Profile.JPG';
  try { localStorage.setItem('bcosAvatar', 'photo:' + url); } catch(e) {}
  document.getElementById('main-logo').innerHTML = '<img src="' + url + '">';
  closeAvatarPicker();
}
function closeAvatarPicker() { document.getElementById('av-picker').classList.remove('open'); }
function setAvatar(e) {
  try { localStorage.setItem('bcosAvatar', e); } catch(err) {}
  document.getElementById('main-logo').textContent = e;
  closeAvatarPicker();
}

const THEMES = [
{n:'星空紫',e:'🔮',c:['#7c8cff','#b48cff'],bg:'radial-gradient(ellipse at 30% 20%,#1a2a5a 0%,#0a0c1a 60%,#060814 100%)'},

async function openThemePicker() {
  document.getElementById('theme-picker').style.display = 'flex';
  document.getElementById('theme-grid').innerHTML = THEMES.map(function(t, i) {
    return '<div onclick="setTheme(' + i + ')" style="text-align:center;cursor:pointer;padding:8px;border-radius:12px;background:rgba(255,255,255,.05)" title="' + t.n + '">'
      + '<div style="width:36px;height:36px;border-radius:50%;margin:0 auto;background:linear-gradient(135deg,' + t.c[0] + ',' + t.c[1] + ');box-shadow:0 0 12px ' + t.c[0] + '66"></div>'
      + '<div style="font-size:10px;margin-top:4px">' + t.e + t.n + '</div></div>';
  }).join('');
  // 直接读 JSON
  try {
    const r = await fetch('wallpaper/manifest.json?t=' + Date.now());
    const m = await r.json();
    const wps = m.wallpapers || [];
    document.getElementById('wp-grid').innerHTML = wps.map(function(w){
      return '<div onclick="setWallpaper(\'' + w.id + '\')" style="cursor:pointer;border-radius:10px;overflow:hidden;position:relative;height:60px;background:#222" title="' + w.name + '">'
        + '<img src="./' + w.file + '" style="width:100%;height:100%;object-fit:cover" loading="lazy" onerror="this.style.display=\'none\'">'
        + '<div style="position:absolute;bottom:0;left:0;right:0;font-size:9px;padding:2px 4px;background:rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + w.name + '</div></div>';
    }).join('');
    // 存起来供 setWallpaper 用
    window._wps = {};
    wps.forEach(function(w){ window._wps[w.id] = w; });
  } catch(e) {}
}
function closeThemePicker() { document.getElementById('theme-picker').style.display = 'none'; }
function setTheme(idx) {
  const t = THEMES[idx] || THEMES[0];
  closeThemePicker();
  // 切换特效：闪光
  const flash = document.createElement('div');
  flash.style.cssText = 'position:fixed;inset:0;z-index:9999;background:' + t.c[0] + ';opacity:.3;pointer-events:none;transition:opacity .5s';
  document.body.appendChild(flash);
  setTimeout(function(){ flash.style.opacity = '0'; }, 50);
  setTimeout(function(){ flash.remove(); }, 600);
  // 应用主题
  document.getElementById('bg').style.background = t.bg;
  document.getElementById('bg').style.transition = 'background .5s ease';
  document.querySelectorAll('h1').forEach(function(el){
    el.style.background = 'linear-gradient(90deg,' + t.c[0] + ',' + t.c[1] + ')';
    el.style.webkitBackgroundClip = 'text';
    el.style.transition = 'all .5s ease';
  });
  try { localStorage.setItem('bcosTheme', idx); } catch(e) {}
}
function setWallpaper(id) {
  const w = (window._wps || {})[id];
  if (!w) return;
  closeThemePicker();
  applyWallpaper(w.file);
  try { localStorage.setItem('bcosBgWp', id); localStorage.removeItem('bcosTheme'); } catch(e) {}
}
function applyWallpaper(url) {
  const bg = document.getElementById('bg');
  let pos = {x:50, y:50};
  try { pos = JSON.parse(localStorage.getItem('bcosBgPos') || '{"x":50,"y":50}'); } catch(e) {}
  bg.style.background = 'url(' + url + ') ' + pos.x + '% ' + pos.y + '% / cover no-repeat';
  bg.style.transition = 'all .5s ease';
  // 长按拖动调整位置
  let dragging = false, sx, sy, ox, oy;
  bg.onpointerdown = function(e){ dragging = true; sx = e.clientX; sy = e.clientY; ox = pos.x; oy = pos.y; bg.setPointerCapture(e.pointerId); };
  bg.onpointermove = function(e){
    if (!dragging) return;
    const r = bg.getBoundingClientRect();
    pos.x = Math.max(0, Math.min(100, ox + (e.clientX - sx) / r.width * 100));
    pos.y = Math.max(0, Math.min(100, oy + (e.clientY - sy) / r.height * 100));
    bg.style.backgroundPosition = pos.x + '% ' + pos.y + '%';
  };
  bg.onpointerup = function(){ dragging = false; try { localStorage.setItem('bcosBgPos', JSON.stringify(pos)); } catch(e) {} };
}
try {
  const st = localStorage.getItem('bcosTheme');
  if (st !== null) setTimeout(function(){ 
    const t = THEMES[parseInt(st)] || THEMES[0];
    document.getElementById('bg').style.background = t.bg;
    document.querySelectorAll('h1').forEach(function(el){
      el.style.background = 'linear-gradient(90deg,' + t.c[0] + ',' + t.c[1] + ')';
      el.style.webkitBackgroundClip = 'text';
    });
  }, 100);
} catch(e) {}
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function(){});
}
