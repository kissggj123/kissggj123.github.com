<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bunny Cockpit OS</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0B1026;color:#fff;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;min-height:100vh}
#bcos-boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#1a2a4a 0%,#0B1026 70%);padding:20px}
#bcos-boot .logo{font-size:72px;margin-bottom:16px;animation:float 3s ease-in-out infinite}
#bcos-boot h1{font-size:28px;font-weight:700;background:linear-gradient(90deg,#7c8cff,#b48cff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#bcos-boot .ver{margin-top:8px;font-size:14px;opacity:.5}
#bcos-boot .memorial{margin-top:28px;text-align:center}
#bcos-boot .memorial .title{font-size:22px;font-weight:700;color:#ff6b7a;letter-spacing:.05em}
#bcos-boot .memorial .days{margin-top:12px;font-size:42px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
#bcos-boot .memorial .days small{font-size:16px;font-weight:400;opacity:.6}
#bcos-boot .memorial .next{margin-top:12px;font-size:13px;opacity:.7}
#bcos-boot .memorial .next b{color:#ffb54d}
#bcos-boot .bottom{position:fixed;bottom:40px;left:0;right:0;display:flex;justify-content:space-between;padding:0 40px}
#bcos-boot .btn{padding:14px 28px;border:none;background:none;color:#ff6b7a;font-size:22px;font-weight:700;cursor:pointer}
#bcos-boot .btn.fs{color:#ffb54d}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>
</head>
<body>
<div id="bcos-boot">
<div class="logo">🐰</div>
<h1>Bunny Cockpit OS</h1>
<div class="ver" id="bcos-ver">v8.2.0</div>
<div class="memorial">
<div class="title">兔可可纪念日</div>
<div class="days"><span id="bcos-days">--</span><small> 天</small></div>
<div class="next" id="bcos-next"></div>
</div>
<div class="bottom">
<button class="btn" onclick="location.href='./car.html'">车机锁屏</button>
<button class="btn fs" onclick="toggleFS()">进入全屏</button>
</div>
</div>
<script src="./js/version.js"></script>
<script>
// 照搬 car.html 的纪念日逻辑
const START_DATE = '2024/03/12 00:00:00';
const MILESTONES = [
  { days: 100, label: '100天纪念' },
  { days: 180, label: '180天纪念' },
  { days: 300, label: '300天纪念' },
  { days: 365, label: '一周年 (365天)' },
  { days: 500, label: '500天纪念' },
  { days: 730, label: '两周年 (730天)' },
  { days: 1000, label: '1000天纪念 (千日里程碑)' },
  { days: 1095, label: '三周年 (1095天)' },
  { days: 1461, label: '四周年 (1461天)' },
  { days: 1500, label: '1500天纪念' },
  { days: 1826, label: '五周年 (1826天)' },
  { days: 2000, label: '2000天纪念' },
  { days: 3652, label: '十周年 (3652天)' },
  { days: 10000, label: '10000天 (万日之约)' }
];
try { document.getElementById('bcos-ver').textContent = window.BCOS_VERSION || 'v8.2.0'; } catch(e) {}
function updateMemorial() {
  try {
    const start = new Date(START_DATE);
    const totalDays = (Date.now() - start.getTime()) / 86400000;
    document.getElementById('bcos-days').textContent = totalDays.toFixed(3);
    const next = MILESTONES.find(function(m) { return totalDays < m.days; });
    const el = document.getElementById('bcos-next');
    if (next && el) {
      const remain = (next.days - totalDays).toFixed(3);
      el.innerHTML = '距 <b>' + next.label + '</b> 还有 <b>' + remain + '</b> 天';
    }
  } catch(e) {}
}
updateMemorial();
setInterval(updateMemorial, 1000);
function toggleFS() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(function(){});
}
</script>
</body>
</html>
