<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - 兔可可王国 · 页面迷路啦</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./icon/192.png">
    <script>
        // GitHub Pages Smart URL Router Fallback
        (function() {
            var path = window.location.pathname.toLowerCase();
            var search = window.location.search || '';
            var hash = window.location.hash || '';

            // Redirect /car, /carlock, /lock, /screensaver to car.html
            if (path.endsWith('/car') || path.endsWith('/carlock') || path.endsWith('/lock') || path.endsWith('/screensaver')) {
                window.location.replace('./car.html' + search + hash);
                return;
            }
            // Redirect /bcos, /desktop, /os to bcos desktop
            if (path.endsWith('/bcos') || path.endsWith('/desktop') || path.endsWith('/os')) {
                window.location.replace('./index.html?bcos=desktop' + hash);
                return;
            }
            // Redirect /anni, /anniversary to anniversary view
            if (path.endsWith('/anni') || path.endsWith('/anniversary')) {
                window.location.replace('./index.html?view=anniversary' + hash);
                return;
            }
        })();
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: radial-gradient(circle at 50% 30%, #1e1022 0%, #0d0614 70%, #06020a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background: rgba(30, 15, 45, 0.7);
            border: 1px solid rgba(255, 107, 157, 0.3);
            border-radius: 20px;
            padding: 2.2rem 1.8rem;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(255, 107, 157, 0.2);
            animation: fadeIn .4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .emoji-header {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 0 12px rgba(255, 107, 157, 0.6));
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ff6b9d 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }
        p {
            font-size: 0.95rem;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .countdown {
            display: inline-block;
            background: rgba(255, 107, 157, 0.12);
            border: 1px solid rgba(255, 107, 157, 0.3);
            color: #ff6b9d;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            margin-bottom: 1.5rem;
        }
        .links {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.85rem 1.2rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f1f5f9;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .link-card:hover {
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.25), rgba(167, 139, 250, 0.25));
            border-color: #ff6b9d;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 107, 157, 0.25);
        }
        .link-card.primary {
            background: linear-gradient(135deg, #ff6b9d, #a78bfa);
            border: none;
            color: #fff;
            box-shadow: 0 4px 14px rgba(255, 107, 157, 0.4);
        }
        .link-card.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(255, 107, 157, 0.6);
        }
        .footer {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji-header">🐰🚗</div>
        <h1>404 页面迷路啦</h1>
        <p>你访问的路径在兔可可王国中暂时找不到～<br>请通过下方快捷导航前往相应系统：</p>
        
        <div id="countdown-box" class="countdown">⏱️ <span id="cd-seconds">8</span> 秒后自动返回王国首页</div>

        <div class="links">
            <a href="./car.html" class="link-card primary">
                <span>🚗 智能座舱 · 车机锁屏</span>
                <span>直达 →</span>
            </a>
            <a href="./index.html?bcos=desktop" class="link-card">
                <span>💻 BCOS 虚拟操作系统</span>
                <span>桌面 →</span>
            </a>
            <a href="./index.html?view=anniversary" class="link-card">
                <span>💕 兔可可相伴纪念日</span>
                <span>查看 →</span>
            </a>
            <a href="./index.html" class="link-card">
                <span>🏰 兔可可大富翁王国首页</span>
                <span>进入 →</span>
            </a>
        </div>

        <div class="footer">
            兔可可王国 · GitHub Pages 智能路由 · v7.8.3.9374
        </div>
    </div>

    <script>
        // Auto return countdown
        var sec = 8;
        var cdEl = document.getElementById('cd-seconds');
        var timer = setInterval(function() {
            sec--;
            if (cdEl) cdEl.textContent = sec;
            if (sec <= 0) {
                clearInterval(timer);
                window.location.replace('./index.html');
            }
        }, 1000);

        // Cancel countdown on click
        document.body.addEventListener('click', function(e) {
            if (timer && !e.target.closest('a')) {
                clearInterval(timer);
                timer = null;
                var box = document.getElementById('countdown-box');
                if (box) box.textContent = '⏱️ 已暂停自动跳转';
            }
        });
    </script>
</body>
</html>
